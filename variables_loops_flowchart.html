<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Variables and CS Concepts - Relationship Visualization</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 1400px;
            width: 100%;
            position: relative;
        }
        
        .diagram {
            position: relative;
            width: 100%;
            height: 800px;
        }
        
        .central-node {
            position: absolute;
            left: 50%;
            top: 40%;
            transform: translate(-50%, -50%);
            width: 180px;
            height: 180px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 1.4em;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
            z-index: 10;
        }
        
        .central-node .subtitle {
            font-size: 0.5em;
            font-weight: normal;
            margin-top: 5px;
            opacity: 0.9;
        }
        
        #display-box {
            position: absolute;
            left: 50%;
            top: 72%;
            transform: translate(-50%, -50%);
            width: 650px;
            min-height: 350px;
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 15px 45px rgba(0,0,0,0.4);
            border: 1px solid #333;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 0.9em;
            line-height: 1.4;
            z-index: 20;
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.3s ease;
            pointer-events: none;
            display: flex;
            flex-direction: column;
        }

        #display-box.show {
            opacity: 1;
            transform: translate(-50%, -52%);
        }

        #display-box h4 {
            color: #667eea;
            margin-bottom: 10px;
            border-bottom: 1px solid #333;
            padding-bottom: 5px;
            font-family: 'Segoe UI', sans-serif;
        }

        .flowchart-svg {
            width: 100%;
            height: 200px;
            margin-top: 10px;
        }
        .flowchart-svg text {
            font-family: 'Segoe UI', sans-serif;
            font-size: 11px;
            fill: #d4d4d4;
        }
        .flow-rect { fill: #2d2d2d; stroke: #667eea; stroke-width: 1.5; }
        .flow-diamond { fill: #2d2d2d; stroke: #2ecc71; stroke-width: 1.5; }
        .flow-arrow { stroke: #667eea; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }

        .datatype-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-family: 'Segoe UI', sans-serif;
            background: #252526;
            color: #d4d4d4;
        }
        .datatype-table th, .datatype-table td {
            border: 1px solid #3e3e42;
            padding: 8px;
            text-align: left;
        }
        .datatype-table th { background-color: #333333; color: #667eea; }
        
        .concept-node {
            position: absolute;
            width: 130px;
            height: 130px;
            background: white;
            border: 4px solid #667eea;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 5;
        }
        
        .concept-node:hover { transform: scale(1.1); }
        .concept-node .icon { font-size: 2.5em; margin-bottom: 5px; }
        .concept-node h3 { font-size: 0.8em; margin: 0; font-weight: bold; }
        
        #hardware { left: 50%; top: 5%; transform: translateX(-50%); border-color: #e74c3c; }
        #datatypes { right: 15%; top: 15%; border-color: #3498db; }
        #ifelse { right: 8%; top: 40%; border-color: #2ecc71; }
        #repetition { right: 15%; bottom: 10%; border-color: #f39c12; }
        #classes { left: 15%; bottom: 10%; border-color: #9b59b6; }
        #functions { left: 8%; top: 40%; border-color: #1abc9c; }

        svg#connections-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        
        .connection-line {
            stroke: #667eea;
            stroke-width: 2;
            fill: none;
            opacity: 0.15;
            stroke-dasharray: 10, 5;
            transition: all 0.3s ease;
        }
        
        .connection-line.active {
            opacity: 1;
            stroke-width: 4;
            animation: flow 1s linear infinite;
        }
        
        @keyframes flow {
            from { stroke-dashoffset: 30; }
            to { stroke-dashoffset: 0; }
        }

        #memory-container {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(30, 30, 30, 0.95);
            padding: 15px;
            border-radius: 8px;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            z-index: 20;
            border: 2px solid #e74c3c;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .memory-cell {
            width: 45px;
            height: 45px;
            background: #444;
            font-size: 9px;
            color: #eee;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 2px;
            font-family: monospace;
            text-align: center;
        }
        .memory-cell .addr { opacity: 0.6; font-size: 7px; }
        .memory-cell .val { font-weight: bold; margin-top: 2px; }
        .memory-cell.age { background: #e74c3c; color: white; }
        .memory-cell.grade { background: #3498db; color: white; }

        .memory-legend {
            font-size: 10px;
            color: white;
            display: flex;
            gap: 10px;
            border-top: 1px solid #444;
            padding-top: 8px;
        }
        .legend-item { display: flex; align-items: center; gap: 5px; }
        .legend-color { width: 10px; height: 10px; border-radius: 2px; }

    </style>
</head>
<body>
    <h1>Variables and Computer Science Concepts</h1>
    
    <div class="container">
        <div class="diagram" id="diagram-area">
            <svg id="connections-svg"></svg>
            
            <div class="central-node" id="central">
                <div>VARIABLES</div>
                <div class="subtitle">Core Building Block</div>
            </div>

            <div id="display-box">
                <h4 id="display-title">Concept Details</h4>
                <div id="display-content"></div>
            </div>
            
            <!-- Nodes -->
            <div class="concept-node" id="hardware" data-title="Hardware Relationship" data-tooltip-type="code" data-content="Variables map to memory addresses in RAM.

int age = 25;        // 4 bytes (0x00 to 0x03)
char grade = 'A';    // 1 byte (0x04)

The grid on the right shows how these are laid out in RAM.">
                <div class="icon">🖥️</div>
                <h3>Hardware</h3>
            </div>

            <div class="concept-node" id="datatypes" data-title="C++ Data Type Sizes" data-tooltip-type="html" data-content="<p>Types define size and range. Typical C++ sizes:</p>
                <table class='datatype-table'>
                    <tr><th>Type</th><th>Size (Bytes)</th><th>Example</th></tr>
                    <tr><td>char</td><td>1</td><td>'A'</td></tr>
                    <tr><td>int</td><td>4</td><td>25</td></tr>
                    <tr><td>float</td><td>4</td><td>19.99f</td></tr>
                    <tr><td>double</td><td>8</td><td>19.9999</td></tr>
                </table>">
                <div class="icon">📊</div>
                <h3>Data Types</h3>
            </div>

            <div class="concept-node" id="ifelse" data-title="Conditional Logic" data-tooltip-type="html" data-content="<div style='font-family:monospace; color:#ce9178; margin-bottom:10px;'>
                int age = 20;<br>
                if (age >= 18) {<br>
                &nbsp;&nbsp;print('Adult');<br>
                } else {<br>
                &nbsp;&nbsp;print('Minor');<br>
                }</div>
                <svg class='flowchart-svg' viewBox='0 0 400 180'>
                    <defs>
                        <marker id='arrowhead' markerWidth='10' markerHeight='7' refX='0' refY='3.5' orient='auto'>
                            <polygon points='0 0, 10 3.5, 0 7' fill='#667eea' />
                        </marker>
                    </defs>
                    <rect x='165' y='5' width='70' height='25' rx='12' class='flow-rect' />
                    <text x='200' y='22' text-anchor='middle'>Start</text>
                    <line x1='200' y1='30' x2='200' y2='50' class='flow-arrow' />
                    <polygon points='200,55 250,80 200,105 150,80' class='flow-diamond' />
                    <text x='200' y='84' text-anchor='middle' style='font-size:9px;'>age >= 18?</text>
                    <line x1='250' y1='80' x2='300' y2='80' class='flow-arrow' />
                    <text x='270' y='75' style='fill:#2ecc71'>True</text>
                    <rect x='300' y='65' width='70' height='30' class='flow-rect' />
                    <text x='335' y='84' text-anchor='middle'>'Adult'</text>
                    <line x1='150' y1='80' x2='100' y2='80' class='flow-arrow' />
                    <text x='115' y='75' style='fill:#e74c3c'>False</text>
                    <rect x='30' y='65' width='70' height='30' class='flow-rect' />
                    <text x='65' y='84' text-anchor='middle'>'Minor'</text>
                    <path d='M335,95 L335,130 L200,130' class='flow-arrow' />
                    <path d='M65,95 L65,130 L200,130' class='flow-arrow' />
                    <rect x='165' y='145' width='70' height='25' rx='12' class='flow-rect' />
                    <text x='200' y='162' text-anchor='middle'>End</text>
                    <line x1='200' y1='130' x2='200' y2='145' class='flow-arrow' />
                </svg>">
                <div class="icon">🔀</div>
                <h3>If/Else</h3>
            </div>

            <div class="concept-node" id="repetition" data-title="Loops & Repetition" data-tooltip-type="html" data-content="<div style='font-family:monospace; color:#ce9178; margin-bottom:10px;'>
                for (int i = 0; i < 5; i++) {<br>
                &nbsp;&nbsp;print('Iteration: ' + i);<br>
                }</div>
                <svg class='flowchart-svg' viewBox='0 0 400 200'>
                    <defs>
                        <marker id='arrowhead' markerWidth='10' markerHeight='7' refX='0' refY='3.5' orient='auto'>
                            <polygon points='0 0, 10 3.5, 0 7' fill='#667eea' />
                        </marker>
                    </defs>
                    <rect x='165' y='5' width='70' height='25' rx='12' class='flow-rect' />
                    <text x='200' y='22' text-anchor='middle'>Start (i=0)</text>
                    <line x1='200' y1='30' x2='200' y2='50' class='flow-arrow' />
                    
                    <polygon points='200,55 250,85 200,115 150,85' class='flow-diamond' />
                    <text x='200' y='90' text-anchor='middle' style='font-size:9px;'>i < 5?</text>
                    
                    <line x1='250' y1='85' x2='300' y2='85' class='flow-arrow' />
                    <text x='270' y='80' style='fill:#2ecc71'>True</text>
                    
                    <rect x='300' y='70' width='85' height='30' class='flow-rect' />
                    <text x='342' y='89' text-anchor='middle'>Print & i++</text>
                    
                    <path d='M342,100 L342,130 L200,130 L200,115' class='flow-arrow' />
                    
                    <line x1='150' y1='85' x2='100' y2='85' class='flow-arrow' />
                    <text x='115' y='80' style='fill:#e74c3c'>False</text>
                    
                    <rect x='30' y='72' width='70' height='25' rx='12' class='flow-rect' />
                    <text x='65' y='89' text-anchor='middle'>Exit</text>
                </svg>">
                <div class="icon">🔁</div>
                <h3>Loops</h3>
            </div>

            <div class="concept-node" id="classes" data-title="Classes & Objects" data-tooltip-type="code" data-content="Instance variables store object state (attributes).

class Student {
    String name;  // Unique to each student
    int age;
}

Student s1 = new Student();
s1.name = 'Alice';">
                <div class="icon">🏛️</div>
                <h3>Classes</h3>
            </div>

            <div class="concept-node" id="functions" data-title="Functions & Scope" data-tooltip-type="code" data-content="Variables are passed as parameters and returned.

void greet(String name) {
    print('Hello ' + name);
}

int add(int a, int b) {
    return a + b;
}">
                <div class="icon">⚙️</div>
                <h3>Functions</h3>
            </div>
        </div>
    </div>
    
    <script>
        const svg = document.getElementById('connections-svg');
        const central = document.getElementById('central');
        const concepts = ['hardware', 'datatypes', 'ifelse', 'repetition', 'classes', 'functions'];
        const displayBox = document.getElementById('display-box');
        const displayTitle = document.getElementById('display-title');
        const displayContent = document.getElementById('display-content');

        // Memory Grid
        const memContainer = document.createElement('div');
        memContainer.id = 'memory-container';
        const grid = document.createElement('div');
        grid.style.display = 'grid';
        grid.style.gridTemplateColumns = 'repeat(4, 45px)';
        grid.style.gap = '4px';
        
        for(let i=0; i<16; i++) {
            const cell = document.createElement('div');
            cell.className = 'memory-cell';
            const addr = '0x' + i.toString(16).toUpperCase().padStart(2, '0');
            let valText = '';
            if(i < 4) { cell.classList.add('age'); valText = 'age'; }
            else if(i === 4) { cell.classList.add('grade'); valText = 'grade'; }
            cell.innerHTML = `<span class="addr">${addr}</span><span class="val">${valText}</span>`;
            grid.appendChild(cell);
        }
        
        const legend = document.createElement('div');
        legend.className = 'memory-legend';
        legend.innerHTML = `
            <div class="legend-item"><div class="legend-color" style="background:#e74c3c"></div> age (4B)</div>
            <div class="legend-item"><div class="legend-color" style="background:#3498db"></div> grade (1B)</div>
        `;
        memContainer.appendChild(grid);
        memContainer.appendChild(legend);
        document.getElementById('diagram-area').appendChild(memContainer);

        function drawConnections() {
            const centralRect = central.getBoundingClientRect();
            const containerRect = svg.getBoundingClientRect();
            const cx = centralRect.left + centralRect.width / 2 - containerRect.left;
            const cy = centralRect.top + centralRect.height / 2 - containerRect.top;
            svg.innerHTML = '';
            concepts.forEach(id => {
                const elem = document.getElementById(id);
                const rect = elem.getBoundingClientRect();
                const ex = rect.left + rect.width / 2 - containerRect.left;
                const ey = rect.top + rect.height / 2 - containerRect.top;
                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('x1', cx); line.setAttribute('y1', cy);
                line.setAttribute('x2', ex); line.setAttribute('y2', ey);
                line.setAttribute('class', 'connection-line');
                line.setAttribute('id', 'line-' + id);
                svg.appendChild(line);
            });
        }

        document.querySelectorAll('.concept-node').forEach(node => {
            node.addEventListener('mouseenter', function() {
                document.getElementById('line-' + this.id)?.classList.add('active');
                displayTitle.innerText = this.getAttribute('data-title');
                const type = this.getAttribute('data-tooltip-type');
                const content = this.getAttribute('data-content');
                if (type === 'html') {
                    displayContent.innerHTML = content;
                    displayBox.style.whiteSpace = 'normal';
                } else {
                    displayContent.textContent = content;
                    displayBox.style.whiteSpace = 'pre-wrap';
                }
                displayBox.classList.add('show');
                if(this.id === 'hardware') memContainer.style.opacity = '1';
            });
            node.addEventListener('mouseleave', function() {
                document.getElementById('line-' + this.id)?.classList.remove('active');
                displayBox.classList.remove('show');
                if(this.id === 'hardware') memContainer.style.opacity = '0';
            });
        });

        drawConnections();
        window.addEventListener('resize', drawConnections);
    </script>
</body>
</html>
