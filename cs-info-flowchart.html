<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS Concepts - Relationship Visualization</title>

<!-- ===============================
                CSS 
===============================. -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .container {
            background: #1f1f1f;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 1400px;
            width: 100%;
            position: relative;
        }
        
        .diagram {
            position: relative;
            width: 100%;
            height: 800px;
        }
        
        .central-node {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 180px;
            height: 180px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 1.4em;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
            z-index: 10;
        }
        
        .central-node .subtitle {
            font-size: 0.5em;
            font-weight: normal;
            margin-top: 5px;
            opacity: 0.9;
        }
        
        #display-box {
            position: absolute;
            left: 50%;
            top: 72%;
            transform: translate(-50%, -50%);
            width: 650px;
            min-height: 350px;
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 15px 45px rgba(0,0,0,0.4);
            border: 1px solid #333;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 0.9em;
            line-height: 1.4;
            z-index: 20;
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.3s ease;
            pointer-events: none;
            display: flex;
            flex-direction: column;
        }

        #display-box.show {
            opacity: 1;
            transform: translate(-50%, -52%);
        }

        #display-box h4 {
            color: #667eea;
            margin-bottom: 10px;
            border-bottom: 1px solid #333;
            padding-bottom: 5px;
            font-family: 'Segoe UI', sans-serif;
        }

        .flowchart-svg {
            width: 100%;
            height: 200px;
            margin-top: 10px;
        }
        .flowchart-svg text {
            font-family: 'Segoe UI', sans-serif;
            font-size: 11px;
            fill: #d4d4d4;
        }
        .flow-rect { fill: #2d2d2d; stroke: #667eea; stroke-width: 1.5; }
        .flow-diamond { fill: #2d2d2d; stroke: #2ecc71; stroke-width: 1.5; }
        .flow-arrow { stroke: #667eea; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }

        .datatype-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-family: 'Segoe UI', sans-serif;
            background: #252526;
            color: #d4d4d4;
        }
        .datatype-table th, .datatype-table td {
            border: 1px solid #3e3e42;
            padding: 8px;
            text-align: left;
        }
        .datatype-table th { background-color: #333333; color: #667eea; }
        
        .concept-node {
            position: absolute;
            width: 130px;
            height: 130px;
            background: white;
            border: 4px solid #667eea;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 5;
        }
        
        .concept-node:hover { transform: scale(1.1); }
        .concept-node .icon { font-size: 2.5em; margin-bottom: 5px; }
        .concept-node h3 { font-size: 0.8em; margin: 0; font-weight: bold; }
        
        /*

        Palette:    
            - d11141
            - e2443b
            - f37735
            - f99e2d
            - ffc425
            - 80bb3f
            - 00b159
            - 00b09a
            - 17b5de
        */

        #hardware { left: 50%; top: 5%; transform: translateX(-50%); border-color: #d11141; }
            #cpu { left: 50%; top: 5%; transform: translateX(-50%); border-color: #d11141; }
        #software { right: 15%; top: 15%; border-color: #e2443b; }
        #programming { right: 8%; top: 40%; border-color: #f99e2d; }
        #ai { right: 15%; bottom: 15%; border-color: #ffc425; }
        #networks { left: 15%; bottom: 15%; border-color: #80bb3f; }
        #data { left: 8%; top: 40%; border-color: #00b159; }
        #cybersecurity { left: 15%; top: 15%; border-color: #00b09a; }
        #ethics { left: 50%; bottom: 5%; transform: translateX(-50%); border-color: #17b5de; }

        svg#connections-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        
        .connection-line {
            stroke: #667eea;
            stroke-width: 2;
            fill: none;
            opacity: 0.15;
            stroke-dasharray: 10, 5;
            transition: all 0.3s ease;
        }
        
        .connection-line.active {
            opacity: 1;
            stroke-width: 4;
            animation: flow 1s linear infinite;
        }
        
        @keyframes flow {
            from { stroke-dashoffset: 30; }
            to { stroke-dashoffset: 0; }
        }

        #memory-container {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(30, 30, 30, 0.95);
            padding: 15px;
            border-radius: 8px;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            z-index: 20;
            border: 2px solid #e74c3c;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .memory-cell {
            width: 45px;
            height: 45px;
            background: #444;
            font-size: 9px;
            color: #eee;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 2px;
            font-family: monospace;
            text-align: center;
        }
        .memory-cell .addr { opacity: 0.6; font-size: 7px; }
        .memory-cell .val { font-weight: bold; margin-top: 2px; }
        .memory-cell.age { background: #e74c3c; color: white; }
        .memory-cell.grade { background: #3498db; color: white; }

        .memory-legend {
            font-size: 10px;
            color: white;
            display: flex;
            gap: 10px;
            border-top: 1px solid #444;
            padding-top: 8px;
        }
        .legend-item { display: flex; align-items: center; gap: 5px; }
        .legend-color { width: 10px; height: 10px; border-radius: 2px; }

    </style>
</head>

<!-- ===============================
            Content
=============================== -->

<body>
    <h1>Computer Science Concepts</h1>
    
    <div class="container">
        <div class="diagram" id="diagram-area">
            <svg id="connections-svg"></svg>
            
            <div class="central-node" id="central">
                <div>Computing</div>
                <div class="subtitle"></div>
            </div>

            <div id="display-box">
                <h4 id="display-title">Concept Details</h4>
                <div id="display-content"></div>
            </div>
            
            <!-- ===============================
                        Nodes


            <div class="concept-node" id="CONCEPT_NAME" data-title="CONCEPT_TITLE" data-tooltip-type="TYPE" data-content="">
                <div class="icon">ICON</div>
                <h3>CONCEPT_NAME</h3>
            </div>
            =============================== -->

            <!-- LAYER ONE -->
            <!-- Hardware Node -->
            <div class="concept-node" id="hardware" data-title="Hardware" data-tooltip-type="code" layer="1" data-content=
                                                                                    "Variables map to memory addresses in RAM.

                                                                                    int age = 25;        // 4 bytes (0x00 to 0x03)
                                                                                    char grade = 'A';    // 1 byte (0x04)

                                                                                    The grid on the right shows how these are laid out in RAM.">
                <div class="icon">🖥️</div>
                <h3>Hardware</h3>
            </div>

            <!-- Software Node -->
            <div class="concept-node" id="software" data-title="Software" data-tooltip-type="TYPE" layer="1" data-content="a">
                <div class="icon">💾</div>
                <h3>Software</h3>
            </div>

            <!-- Programming Node -->
            <div class="concept-node" id="programming" data-title="Programming" data-tooltip-type="TYPE" layer="1" data-content="a">
                <div class="icon">⌨️</div>
                <h3>Programming</h3>
            </div>

            <!-- AI Node -->
            <div class="concept-node" id="ai" data-title="AI" data-tooltip-type="TYPE" layer="1" data-content="a">
                <div class="icon">💡</div>
                <h3>AI</h3>
            </div>

            <!-- Networks Node -->
            <div class="concept-node" id="networks" data-title="Networks" data-tooltip-type="TYPE" layer="1" data-content="a">
                <div class="icon">🌐</div>
                <h3>Networks</h3>
            </div>

            <!-- Cybersecurity Node -->
            <div class="concept-node" id="cybersecurity" data-title="Cybersecurity" data-tooltip-type="TYPE" layer="1" data-content="a">
                <div class="icon">🌐</div>
                <h3>Cybersecurity</h3>
            </div>

            <!-- Data Node -->
            <div class="concept-node" id="data" data-title="Data" data-tooltip-type="TYPE" layer="1" data-content="a">
                <div class="icon">🌐</div>
                <h3>Data</h3>
            </div>

            <!-- Ethics Node -->
            <div class="concept-node" id="ethics" data-title="Ethics" data-tooltip-type="TYPE" layer="1" data-content="a">
                <div class="icon">🌐</div>
                <h3>Ethics</h3>
            </div>


            <!-- LAYER Two -->
             <div class="concept-node" id="ethics" data-title="Ethics" data-tooltip-type="TYPE" layer="1" data-content="a">
                <div class="icon">🌐</div>
                <h3>Ethics</h3>
            </div>

        </div>
    </div>

    <script>
        const svg = document.getElementById('connections-svg');
        const central = document.getElementById('central');
        const concepts = ['hardware', 'software', 'programming', 'ai', 'networks', 'data', 'cybersecurity', 'ethics'];
        const displayBox = document.getElementById('display-box');
        const displayTitle = document.getElementById('display-title');
        const displayContent = document.getElementById('display-content');

        // Memory Grid
        const memContainer = document.createElement('div');
        memContainer.id = 'memory-container';
        const grid = document.createElement('div');
        grid.style.display = 'grid';
        grid.style.gridTemplateColumns = 'repeat(4, 45px)';
        grid.style.gap = '4px';
        
        for(let i=0; i<16; i++) {
            const cell = document.createElement('div');
            cell.className = 'memory-cell';
            const addr = '0x' + i.toString(16).toUpperCase().padStart(2, '0');
            let valText = '';
            if(i < 4) { cell.classList.add('age'); valText = 'age'; }
            else if(i === 4) { cell.classList.add('grade'); valText = 'grade'; }
            cell.innerHTML = `<span class="addr">${addr}</span><span class="val">${valText}</span>`;
            grid.appendChild(cell);
        }
        
        const legend = document.createElement('div');
        legend.className = 'memory-legend';
        legend.innerHTML = `
            <div class="legend-item"><div class="legend-color" style="background:#e74c3c"></div> age (4B)</div>
            <div class="legend-item"><div class="legend-color" style="background:#3498db"></div> grade (1B)</div>
        `;
        memContainer.appendChild(grid);
        memContainer.appendChild(legend);
        document.getElementById('diagram-area').appendChild(memContainer);

        // Draw connections
        //  between Nodes
        function drawConnections() {
            const centralRect = central.getBoundingClientRect();
            const containerRect = svg.getBoundingClientRect();
            const cx = centralRect.left + centralRect.width / 2 - containerRect.left;
            const cy = centralRect.top + centralRect.height / 2 - containerRect.top;
            svg.innerHTML = '';
            concepts.forEach(id => {
                const elem = document.getElementById(id);
                const rect = elem.getBoundingClientRect();
                const ex = rect.left + rect.width / 2 - containerRect.left;
                const ey = rect.top + rect.height / 2 - containerRect.top;
                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('x1', cx); line.setAttribute('y1', cy);
                line.setAttribute('x2', ex); line.setAttribute('y2', ey);
                line.setAttribute('class', 'connection-line');
                line.setAttribute('id', 'line-' + id);
                svg.appendChild(line);
            });
        }

        document.querySelectorAll('.concept-node').forEach(node => {
            node.addEventListener('mouseenter', function() {
                document.getElementById('line-' + this.id)?.classList.add('active');
                displayTitle.innerText = this.getAttribute('data-title');
                const type = this.getAttribute('data-tooltip-type');
                const content = this.getAttribute('data-content');
                if (type === 'html') {
                    displayContent.innerHTML = content;
                    displayBox.style.whiteSpace = 'normal';
                } else {
                    displayContent.textContent = content;
                    displayBox.style.whiteSpace = 'pre-wrap';
                }
                displayBox.classList.add('show');
                if(this.id === 'hardware') memContainer.style.opacity = '1';
            });
            node.addEventListener('mouseleave', function() {
                document.getElementById('line-' + this.id)?.classList.remove('active');
                displayBox.classList.remove('show');
                if(this.id === 'hardware') memContainer.style.opacity = '0';
            });
        });

        drawConnections();
        window.addEventListener('resize', drawConnections);
    </script>
</body>
</html>
